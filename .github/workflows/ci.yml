# Cada push a main y cada Pull Request: tests, análisis estático y búsqueda de secretos.
# No publica nada: sirve para enterarse temprano si algo dejó de andar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=5 update -q && sudo apt-get -o Acquire::Retries=5 install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Análisis estático
        run: python -m pyflakes src/networktool/app.py src/networktool/common.py src/networktool/data src/networktool/net src/networktool/ui tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Interfaz con PySide6
        run: python tests/smoke_ui.py

  # La línea de Windows 7/8 corre con Python 3.8 + PySide2 (Qt 5): el código tiene
  # que seguir andando ahí. Se prueba en 32 bits, que es lo más restrictivo.
  windows7:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x86
      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Interfaz con PySide2
        run: python tests/smoke_ui.py
      - name: Aplicación completa con PySide2 (abre, cierra y sale con 0)
        env:
          NETWORKTOOL_SMOKE_TEST: "1"
        run: python src/main.py

  secretos:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
